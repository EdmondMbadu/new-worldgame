<router-outlet></router-outlet>

<div
  *ngIf="showRouteLoading"
  class="pointer-events-none fixed inset-x-0 top-0 z-[1000] h-1 overflow-hidden bg-emerald-100 dark:bg-emerald-950"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <span class="route-loading-bar" aria-hidden="true"></span>
  <span class="sr-only">{{ "app.loading.title" | translate }}</span>
</div>
