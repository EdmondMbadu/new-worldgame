<div class="min-h-screen overflow-x-hidden bg-gray-100 dark:bg-slate-900">
    <app-navbar 
      [hoveredTournamentPath]="'bg-gray-100 dark:bg-gray-700'" 
      [showMoreOrLess]="true" 
      [sideBarSmall]="true" 
      [sideBarBig]="false" 
      [email]="this.auth.currentUser.email"
      [firstName]="this.auth.currentUser.firstName"
      [lastName]="this.auth.currentUser.lastName"
      [path]="'home'" 
      [currentPageTournament]="true">
    </app-navbar>
    <!-- Active Tournaments Section -->
  
<section class="mt-14 py-8">
    <div class="mx-auto max-w-7xl px-3 sm:px-4 lg:px-8">

      <!-- Title -->
      <div class="text-center mb-10">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl">
          Active Tournaments
        </h1>
        <p class="mt-2 text-sm italic text-gray-500 dark:text-gray-400 sm:text-base">
          Submit your solution before the deadline to compete!
        </p>
      </div>

      <!-- Loading spinner -->
      <div *ngIf="isLoading" class="flex justify-center py-12">
        <svg class="w-10 h-10 text-gray-400 animate-spin" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4" class="opacity-25"/>
          <path d="M4 12a8 8 0 018-8"
                stroke="currentColor" stroke-width="4"
                stroke-linecap="round" class="opacity-75"/>
        </svg>
      </div>

      <!-- Empty state -->
      <p *ngIf="!isLoading && tournaments.length === 0"
         class="text-center text-gray-600 dark:text-gray-400">
        No active tournaments at the moment.
      </p>

      <!-- List -->
      <div class="space-y-6" *ngIf="tournaments.length">

        <div *ngFor="let t of tournaments"
             [routerLink]="['/tournament-details', t.tournamentId]"
             class="flex flex-col md:flex-row bg-white dark:bg-gray-800
                    rounded-lg overflow-hidden shadow-md hover:shadow-lg
                    transition cursor-pointer">

          <img [src]="coverImage(t)" alt="cover"
               class="w-full md:w-1/3 object-cover">

          <div class="flex w-full flex-col justify-between p-4 sm:p-6">
            <div>
              <h2 class="text-xl font-semibold italic text-gray-900 dark:text-white sm:text-2xl">
                {{ t.title }}
              </h2>

              <p class="mt-2 line-clamp-3 text-sm text-gray-700 dark:text-gray-300 sm:text-base">
                {{ t.subtTitle || t.instruction }}
              </p>
            </div>

            <div class="mt-4 flex flex-wrap gap-3 text-sm text-gray-700 dark:text-gray-300 sm:gap-8">
              <div>Participants:
                <span class="font-semibold">{{ participantsCount(t) }}</span>
              </div>
              <div>Deadline:
                <span class="font-semibold">
                  {{ t.deadline | date:'MMM d, y' }}
                </span>
              </div>
              <div>Prize:
                <span class="font-semibold">
                  ${{ t.prizeAmount || '—' }}
                </span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
  </div>
