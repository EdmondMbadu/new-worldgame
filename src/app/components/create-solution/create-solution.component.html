<main *ngIf="currentIndexDisplay >= 0" class="solution-builder">
  <div class="builder-shell">
    <header class="builder-header">
      <button
        type="button"
        class="builder-back"
        (click)="goBackTimeLine(currentIndexDisplay)"
        [attr.aria-label]="'createSolution.builder.back' | translate"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m15 19-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <div class="builder-heading">
        <p>{{ 'createSolution.builder.eyebrow' | translate }}</p>
        <h1>{{ 'createSolution.builder.title' | translate }}</h1>
      </div>

      <span class="builder-step-count">
        {{ currentIndexDisplay + 1 }} / {{ steps.length }}
      </span>
    </header>

    <div
      class="builder-progress"
      role="progressbar"
      [attr.aria-label]="'createSolution.builder.progress' | translate"
      [attr.aria-valuenow]="initial"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <span [style.width.%]="initial"></span>
    </div>

    <section class="builder-workspace" aria-labelledby="current-step-heading">
      <div class="builder-step-heading">
        <span>{{ 'createSolution.builder.step' | translate }} {{ currentIndexDisplay + 1 }}</span>
        <h2 id="current-step-heading">{{ stepLabelKeys[currentIndexDisplay] | translate }}</h2>
      </div>

      <ng-container *ngFor="let s of steps; let i = index">
        <app-create-solution-steps
          *ngIf="display[i]"
          [text]="s | translate"
          [buttonTextKey]="buttonTextKeys[i]"
          [buttonAction]="buttonActions[i]"
          (buttonInfoEvent)="updatePlayground($event)"
          [stepNumber]="currentIndexDisplay"
          [focusSelectedArray]="selected"
          [sdgSelected]="sdgSelected"
        ></app-create-solution-steps>
      </ng-container>
    </section>
  </div>
</main>
